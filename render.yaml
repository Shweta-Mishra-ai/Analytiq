services:
  - type: web
    name: analytiq
    runtime: docker
    # At least 2 GB of memory. Measured: 240 MB idle, 700 MB with a few
    # reports running, 1 GB while a 59 MB file loads. A 512 MB instance is
    # killed by the first large upload. Check what your plan provides.
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false        # set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false        # set in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false        # optional: Claude for chat and report text
      - key: SUPPORT_EMAIL
        sync: false        # shown to clients on error screens
      - key: APP_PUBLIC_URL
        sync: false        # https://your-address: used in the Claude connector address and report links
      - key: ALERT_WEBHOOK_URL
        sync: false        # optional: unexpected errors are posted here (Slack-style webhook)
      - key: MAX_FILE_MB
        value: "50"        # raise only with more memory (docs/OPERATIONS.md)
      - key: APP_ADMIN_KEY
        sync: false        # set in Render dashboard — gates account management, see README
      - key: FREE_USERS
        sync: false        # your own username(s): never charged
      - key: BUSINESS_NAME
        sync: false        # shown on the public policy pages
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false        # UPI, cards, netbanking (docs/OPERATIONS.md)
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox     # switch to live after a test purchase
      - key: SMTP_HOST
        sync: false        # email: verification, password reset, receipts
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: UPI_ID
        sync: false        # direct UPI transfers, approved on /admin
      - key: GSTIN
        sync: false        # with it, tax invoices; confirm the setup with your CA
      - key: DATA_DIR
        value: /srv/data
    disk:
      name: analytiq-data
      mountPath: /srv/data
      sizeGB: 5
