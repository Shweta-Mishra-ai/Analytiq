services:
  - type: web
    name: dataforge-pro
    runtime: docker
    plan: starter          # upgrade for more RAM if training large datasets
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false        # set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false        # set in Render dashboard
      # Optional extra providers, all free-tier, all serving openly
      # licensed weights. Any one of them is enough; the app falls
      # through the configured ones and skips the rest. After deploying,
      # POST /api/admin/llm-check (or open the System page) to confirm
      # the keys work from Render itself — that is the only machine that
      # can answer it.
      - key: OPENROUTER_API_KEY
        sync: false        # set in Render dashboard
      - key: CEREBRAS_API_KEY
        sync: false        # set in Render dashboard
      - key: TOGETHER_API_KEY
        sync: false        # set in Render dashboard
      - key: APP_ADMIN_KEY
        sync: false        # set in Render dashboard — gates account management, see README
      - key: DATA_DIR
        value: /srv/data
    disk:
      name: dataforge-data
      mountPath: /srv/data
      sizeGB: 5
