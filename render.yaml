services:
  - type: web
    name: dataforge-pro
    runtime: docker
    # At least 2 GB of memory. Measured: 240 MB idle, 700 MB with a few
    # reports running, 1 GB while a 59 MB file loads. A 512 MB instance is
    # killed by the first large upload. Check what your plan provides.
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false        # set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false        # set in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false        # optional: Claude for chat and report text
      - key: SUPPORT_EMAIL
        sync: false        # shown to clients on error screens
      - key: MAX_FILE_MB
        value: "50"        # raise only with more memory (docs/OPERATIONS.md)
      - key: APP_ADMIN_KEY
        sync: false        # set in Render dashboard — gates account management, see README
      - key: DATA_DIR
        value: /srv/data
    disk:
      name: dataforge-data
      mountPath: /srv/data
      sizeGB: 5
