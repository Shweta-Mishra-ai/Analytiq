<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <!-- background -->
  <rect width="800" height="200" rx="16" fill="#0f172a"/>
  <!-- gradient definitions -->
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- icon mark -->
  <g transform="translate(60, 40)">
    <!-- outer glowing ring/hexagon -->
    <path d="M 40 10 L 80 30 L 80 80 L 40 100 L 0 80 L 0 30 Z" fill="none" stroke="url(#neonGlow)" stroke-width="6" stroke-linejoin="round"/>
    <!-- inner abstract analytics chart/microchip bars -->
    <rect x="22" y="35" width="8" height="40" rx="3" fill="url(#neonGlow)"/>
    <rect x="36" y="25" width="8" height="50" rx="3" fill="url(#neonGlow)"/>
    <rect x="50" y="45" width="8" height="30" rx="3" fill="url(#neonGlow)"/>
  </g>
  <!-- text -->
  <text x="180" y="115" font-family="'Outfit', 'Inter', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="2">
    ANALYTIQ
  </text>
  <!-- tag line -->
  <text x="182" y="150" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="4">
    AI-POWERED DATA INTELLIGENCE PLATFORM
  </text>
</svg>
